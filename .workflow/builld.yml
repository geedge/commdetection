name: commdetection-build
displayName: 'Golang command-detection test&build'
triggers:
  push:
    - matchType: PRECISE
      branch: master
commitMessage: ''
stages:
  - stage:
      name: commdetection-test-and-build-stage
      displayName: 'commdetection test and build stage'
      failFast: true
      steps:
        - step: golangbuild@1
          name: test-step
          displayName: 'Test Step'
          inputs:
            golangVersion: 1.13
            goals: | 
              mkdir bin
              GOOS=linux ARCH=amd64
              go test --timeout=30s -covermode=atomic commdetection/...
              go test -bench=. --timeout=30s commdetection/...
              go build -o bin/commdetecion.amd64 commdetection
            uploadArtifact: true
            uploadArtifactOptions:
              artifactPath: '/bin'
              artifactRepository: 'commdetection'
              artifactName: 'commdetection'